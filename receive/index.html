<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Receive File — PDF Slim</title>
  <meta name="description" content="Receive your file directly from your computer. Peer-to-peer transfer, no upload, no servers storing your data." />
  <meta name="theme-color" content="#0EA5E9" />
  <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
  <link rel="canonical" href="https://pdfslim.app/receive/" />
  <style>
    :root {
      --brand: #0EA5E9;
      --brand-dark: #0369A1;
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --muted: #64748B;
      --ok: #16A34A;
      --err: #DC2626;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(2, 6, 23, 0.08);
      padding: 32px 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
      text-decoration: none;
      margin-bottom: 20px;
    }
    .brand svg { width: 22px; height: 22px; color: var(--brand); }
    .icon {
      width: 64px;
      height: 64px;
      margin: 8px auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #E0F2FE;
      color: var(--brand);
    }
    .icon svg { width: 32px; height: 32px; }
    .icon.ok { background: #DCFCE7; color: var(--ok); }
    .icon.err { background: #FEE2E2; color: var(--err); }
    h1 { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .status { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .spinner {
      width: 28px; height: 28px; margin: 12px auto;
      border: 3px solid #E2E8F0;
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-bar {
      height: 6px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      margin: 16px 0 8px;
    }
    .progress-bar span {
      display: block;
      height: 100%;
      background: var(--brand);
      width: 0%;
      border-radius: 999px;
      transition: width 0.15s;
    }
    .file-name { font-size: 13px; font-weight: 600; color: var(--text); word-break: break-all; }
    .download-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 18px;
      background: var(--brand);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .download-btn:hover { background: var(--brand-dark); }
    .foot { margin-top: 20px; font-size: 11px; color: #94A3B8; }
  </style>
</head>
<body>
  <div class="card">
    <a class="brand" href="../">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"/><line x1="16" y1="8" x2="2" y2="22"/><line x1="17.5" y1="15" x2="9" y2="15"/></svg>
      PDF&nbsp;Slim
    </a>
    <div id="icon" class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
    </div>
    <h1 id="title">Connecting…</h1>
    <p id="status" class="status">Waiting for your computer to send the file</p>
    <div id="spinner" class="spinner"></div>
    <div id="progressWrap" style="display:none">
      <div class="file-name" id="fileName"></div>
      <div class="progress-bar"><span id="progressBar"></span></div>
      <p id="progressText" class="status"></p>
    </div>
    <div id="doneWrap" style="display:none">
      <a id="downloadBtn" class="download-btn" download>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Save file
      </a>
      <p id="doneHint" class="status"></p>
    </div>
    <div id="errWrap" style="display:none">
      <p id="errMsg" class="status"></p>
      <button onclick="location.reload()" style="margin-top:14px;background:#E2E8F0;border:none;padding:10px 22px;border-radius:10px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer">Try again</button>
    </div>
    <p class="foot">Peer-to-peer transfer · No upload · Files don't pass through any server</p>
  </div>
  <script type="module" src="./receive.js"></script>
</body>
</html>
